
name: Notme Proxy Pool

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3,15 * * *"

permissions:
  contents: write

concurrency:
  group: notme-proxy-pool
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out config repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --disable-pip-version-check "requests>=2.32,<3"

      - name: Refresh candidate proxy pool without editing signed sites.json
        env:
          NOTME_PROXY_OUTPUT: proxy-pool.json
          NOTME_PROXY_LIMIT: "40"
          NOTME_MIN_POOL: "8"
          NOTME_SOURCE_LIMIT: "60"
        run: python tools/notme_proxy_pool.py

      - name: Commit only the unsigned candidate sidecar
        shell: bash
        run: |
          if [ ! -f proxy-pool.json ]; then
            echo "No valid proxy sidecar was produced."
            exit 0
          fi

          git add -- proxy-pool.json

          if git diff --cached --quiet; then
            echo "Proxy pool unchanged."
            exit 0
          fi

          if ! git diff --quiet -- sites.json; then
            echo "ERROR: Signed sites.json was modified."
            exit 1
          fi

          git config user.name "notme-proxy-pool[bot]"
          git config user.email "notme-proxy-pool[bot]@users.noreply.github.com"

          git commit -m "Refresh proxy candidates"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
