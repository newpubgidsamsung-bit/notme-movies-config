name: Notme Proxy Pool

on:
  workflow_dispatch:
  schedule:
    # Twice per day, intentionally away from the top of the hour.
    - cron: '23 3,15 * * *'

permissions:
  contents: write

concurrency:
  group: notme-proxy-pool
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out config repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'

      - name: Refresh candidate proxy pool
        env:
          NOTME_SITES_CONFIG: sites.json
          NOTME_PROXY_LIMIT: '40'
          NOTME_MIN_POOL: '8'
          NOTME_SOURCE_LIMIT: '60'
        run: python tools/notme_proxy_pool.py

      - name: Commit only when sites.json really changed
        shell: bash
        run: |
          if git diff --quiet -- sites.json; then
            echo "Proxy pool unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "notme-proxy-pool[bot]"
          git config user.email "notme-proxy-pool[bot]@users.noreply.github.com"
          git add sites.json
          git commit -m "Refresh proxy candidate pool"
          # Rebase once in case the panel edited sites.json while this run was active.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
